name: Convert Template to JSON

# No possibility to use on.workflow_run.workflows[Common issues check] inside PR
# because GHA sucks - https://github.com/orgs/community/discussions/25220\
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'default.template.json5'
      - '.github/workflows/generate-renovate-config.yaml'

jobs:
  generate-renovate-config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Update default.json
      id: update_json
      shell: bash
      run: |
        npx --yes json5@2.2.3 default.template.json5 \
          | jq '{description: "THIS FILE IS GENERATED FROM default.template.json5"} + .' \
          > default.json

    - name: Push fixes
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
      with:
        # Determines the way the action fills missing author name and email. Three options are available:
        # - github_actor -> UserName <UserName@users.noreply.github.com>
        # - user_info -> Your Display Name <your-actual@email.com>
        # - github_actions -> github-actions <email associated with the github logo>
        # Default: github_actor
        default_author: github_actor
        # The message for the commit.
        # Default: 'Commit from GitHub Actions (name of the workflow)'
        message: 'chore: Regenerate default.json'
